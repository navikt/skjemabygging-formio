name: Cypress Tests

on: push
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: Europe/Oslo

jobs:
  setup-fyllut:
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
      packages: read
    outputs:
      cypress-folders: ${{ steps.generate-cypress-folders.outputs.cypress-folders }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Generate list of folders containing cypress tests
        id: generate-cypress-folders
        run: |
          echo cypress-folders=$(node bin/get-folders.mjs packages/fyllut/cypress/e2e) >> "$GITHUB_OUTPUT"

  cypress-run-fyllut:
    name: fyllut ${{ matrix.folder }}
    runs-on: ubuntu-latest-8-cores
    needs: [setup-fyllut]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup-fyllut.outputs.cypress-folders) }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Install Cypress binary (fyllut)'
        run: pnpm --dir packages/fyllut exec cypress install
      - name: 'Build fyllut'
        run: pnpm build:fyllut
      - name: 'Run mock server'
        run: pnpm mocks:fyllut:no-cli > /tmp/fyllut-mocks.log 2>&1 &
      - name: 'Cypress tests (fyllut)'
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          start: pnpm preview:fyllut
          wait-on: 'http://localhost:3001/fyllut/internal/isready'
          wait-on-timeout: 120
          command: pnpm --dir packages/fyllut exec cypress run --browser electron --spec cypress/e2e/${{ matrix.folder }}/**/* --expose INCLUDE_DIST_TESTS=true
        env:
          FYLLUT_BACKEND_LOGLEVEL: ${{ runner.debug == '1' && 'debug' || 'error' }}
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path:  ${{ github.workspace }}/packages/fyllut/cypress/screenshots/*


  cypress-run-bygger:
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: 'read'
      packages: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: 'Install Cypress binary (bygger)'
        run: pnpm --dir packages/bygger exec cypress install
      - name: 'Build bygger'
        run: pnpm build:bygger
      - name: 'Cypress tests (bygger)'
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          start: pnpm preview:bygger
          wait-on: 'http://localhost:3000/internal/isready'
          wait-on-timeout: 120
          command: pnpm --dir packages/bygger exec cypress run --browser electron
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-bygger-screenshots-${{ strategy.job-index }}
          path:  ${{ github.workspace }}/packages/bygger/cypress/screenshots/*
