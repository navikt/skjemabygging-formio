name: Manual deploy
run-name: Manual deploy to ${{ inputs.environment }} [${{ github.ref_name }}]
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - preprod-alt
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  package-and-push-bygger:
    name: 'Package bygger'
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'Build application: Bygger'
        env:
          VITE_GIT_VERSION: ${{ github.sha }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
        run: pnpm install --frozen-lockfile && pnpm build:bygger && pnpm run deploy:bygger-backend

      - name: 'Build and push Docker image for bygger'
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-build-push-bygger
        with:
          team: skjemadigitalisering
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: bygger-${{ inputs.environment }}
          build_args: |
            git_sha=${{ github.sha }}
          dockerfile: ./docker/Dockerfile.bygger
          docker_context: ./packages
    outputs:
      image: ${{ steps.docker-build-push-bygger.outputs.image }}

  package-and-push-fyllut-base:
    name: 'Package fyllut'
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: 'Build application: Fyllut'
        env:
          VITE_GIT_VERSION: ${{ github.sha }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
        run: pnpm install --frozen-lockfile && pnpm build:fyllut && pnpm run deploy:fyllut-backend

      - name: 'Build and push Docker image for fyllut'
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-build-push-fyllut
        with:
          team: skjemadigitalisering
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: fyllut-base-dev # base image for dev
          build_args: |
            git_sha=${{ github.sha }}
          dockerfile: ./docker/Dockerfile.fyllut-base
          docker_context: ./packages
          pull: true
          tag: ${{ github.sha }}
    outputs:
      image: ${{ steps.docker-build-push-fyllut.outputs.image }}

  deploy-bygger-to-preprod:
    name: 'Deploy bygger to preprod'
    needs: [package-and-push-bygger, package-and-push-fyllut-base]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Deploy to preprod'
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: 'dev-gcp'
          RESOURCE: './.nais/bygger/nais.yaml'
          VARS: './.nais/bygger/${{ github.event.inputs.environment }}.yaml'
          VAR: image=${{ needs.package-and-push-bygger.outputs.image }}

  deploy-fyllut-to-preprod:
    name: 'Deploy fyllut to preprod'
    needs: [package-and-push-bygger, package-and-push-fyllut-base]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Deploy to preprod'
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: 'dev-gcp'
          RESOURCE: './.nais/fyllut/config.yaml'
          VARS: './.nais/fyllut/${{ github.event.inputs.environment }}.yaml'
          VAR: image=${{ needs.package-and-push-fyllut-base.outputs.image }}

  deploy-form-spec-api-to-dev:
    name: 'Form-spec-api'
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-form-spec-api.yaml
    with:
      git_sha: ${{ github.sha }}
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'

  deploy-sendinn-to-preprod:
    name: 'Sendinn'
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-sendinn.yaml
    with:
      git_sha: ${{ github.sha }}
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
