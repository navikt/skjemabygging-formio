name: Playwright pilot in FyllUt

on:
  push:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Matching 45-case benchmark samples on one build
        type: choice
        options: ['1', '3']
        default: '3'

permissions:
  contents: read
  packages: read

concurrency:
  group: playwright-fyllut-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Oslo
  FYLLUT_CI_RUNNER_CLASS: ubuntu-latest-8-cores

jobs:
  pilot:
    name: Playwright pilot in FyllUt
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 60
    steps:
      - name: Record start
        id: start
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Verify migration baseline is available
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const { revision } = JSON.parse(readFileSync("packages/fyllut/playwright/migration/inventory.json"));
            execFileSync("git", ["cat-file", "-e", `${revision}^{commit}`], { stdio: "inherit" });
          '

      - name: Install dependencies
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          started=$SECONDS
          pnpm install --frozen-lockfile
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        id: browsers
        run: |
          started=$SECONDS
          pnpm --dir packages/fyllut exec playwright install --with-deps chromium
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Install Cypress for the manual comparison
        if: github.event_name == 'workflow_dispatch'
        id: cypress
        run: |
          started=$SECONDS
          pnpm --dir packages/fyllut exec cypress install
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Check test-support types
        run: |
          pnpm exec tsc --project packages/fyllut/playwright/tsconfig.json --noEmit
          pnpm exec tsc --project mocks/tsconfig.json --noEmit

      - name: Build FyllUt once
        id: build
        run: |
          started=$SECONDS
          pnpm build:fyllut
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"

      - name: Verify isolation, lifecycle and failure controls
        run: pnpm playwright:fyllut:verify

      - name: Run all 46 built pilot cases
        run: pnpm playwright:fyllut:built

      - name: Measure matching cases on the same build
        if: github.event_name == 'workflow_dispatch'
        env:
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          pnpm playwright:fyllut:measure --repetitions "$REPETITIONS" \
            --output packages/fyllut/.runtime/playwright-measurements/ci

      - name: Upload HTML test reports and timing summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fyllut-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            packages/fyllut/.runtime/playwright/*/html/
            packages/fyllut/.runtime/playwright/*/results.json
            packages/fyllut/.runtime/playwright/*/run.json
            packages/fyllut/.runtime/playwright/*/summary.json
            packages/fyllut/.runtime/playwright/*/epochs/*/timings.json
            packages/fyllut/.runtime/playwright/*/epochs/*/startup.json
            packages/fyllut/.runtime/playwright/*/epochs/*/mock-evidence.json
            packages/fyllut/.runtime/playwright-measurements/ci/summary.json
            packages/fyllut/.runtime/playwright-measurements/ci/summary.md
            packages/fyllut/.runtime/playwright-measurements/ci/cypress-*/screenshots/
            packages/fyllut/.runtime/playwright-measurements/ci/cypress-*/epochs/*/startup.json

      - name: Summarize measured work
        if: always()
        env:
          START_MS: ${{ steps.start.outputs.ms }}
          DEPENDENCIES_SECONDS: ${{ steps.dependencies.outputs.seconds }}
          BROWSERS_SECONDS: ${{ steps.browsers.outputs.seconds }}
          CYPRESS_SECONDS: ${{ steps.cypress.outputs.seconds }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "# Playwright pilot in FyllUt - CI timing"
            echo
            echo "Dependency installation: ${DEPENDENCIES_SECONDS:-not completed} s"
            echo "Chromium installation: ${BROWSERS_SECONDS:-not completed} s"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Cypress installation: ${CYPRESS_SECONDS:-not completed} s"
            fi
            echo "Build: ${BUILD_SECONDS:-not completed} s"
            if [ -n "$START_MS" ]; then
              echo "Elapsed through artifact upload: $(( $(date +%s%3N) - START_MS )) ms"
            else
              echo "Elapsed time unavailable: the start step did not complete."
            fi
            echo
            echo "Completed job duration in Actions also includes post-job cache actions."
            echo
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "Benchmark not requested. Push runs validate the pilot without repeating it for timing."
              echo "Use Run workflow for a manual Cypress/Playwright comparison, or pnpm playwright:fyllut:measure locally."
            elif [ -f packages/fyllut/.runtime/playwright-measurements/ci/summary.md ]; then
              cat packages/fyllut/.runtime/playwright-measurements/ci/summary.md
            else
              echo "No completed benchmark report. Inspect the preceding failed or cancelled steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
