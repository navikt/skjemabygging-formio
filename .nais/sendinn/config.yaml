---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{app-name}}
  namespace: skjemadigitalisering
  labels:
    team: skjemadigitalisering
spec:
  image: {{image}}
  port: 8080
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
  idporten:
    enabled: true
    sidecar:
      enabled: true
      locale: nb
      autoLogin: false
      level: idporten-loa-high
  tokenx:
    enabled: true
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
  liveness:
    path: /sendinn/internal/isAlive
    initialDelay: 10
  readiness:
    path: /sendinn/internal/isReady
    initialDelay: 10
  replicas:
    min: {{replicas-min}}
    max: {{replicas-max}}
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  prometheus:
    enabled: true
    path: /sendinn/internal/metrics
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      {{#each accessPolicy.outbound.rules}}
        - application: {{this.application}}
          namespace: {{this.namespace}}
          cluster: {{this.cluster}}
      {{/each}}
  env:
    - name: PORT
      value: "8080"
    - name: FORMS_API_URL
      value: {{forms-api-url}}
    - name: INNSENDING_API_AUDIENCE
      value: {{innsending-api-audience}}
